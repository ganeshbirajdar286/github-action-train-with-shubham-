# goal - I have to ensure the package & dependencies have been audited for security 

name: dependency-scan
on: workflow_call

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name:  setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.22
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulcheck
        continue-on-error: true
        run: govulcheck ./backend/..
      - name: upload report to artifact
        uses: actions/upload-artifact@v4
        with: 
          name:  go-report
          path:  report /govulcheck-report.txt
          retention-days: 5


