# goal - ensue the docker files and  docker images are security  tested
name: docker scan
on: 
   workflow_call:

jobs:
    docker-file-lint-and_scann:
        runs-on: ubuntu-latest
        steps:
          - name: code checkout
            uses: actions/checkout@v7
          - name: docker linting
            uses: hadolint/hadolint-action@v3.1.0
            with:
              dockerfile: dockerfile
            
          - name: docker image build
            uses: docker/login-action@v4
            with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Docker Build and Push
            run:  docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest .
            
          - name:  run trivy vulenrability scanner
            uses: aquasecurity/trivy-action@0.36.0
            with:
              image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest .
              format: 'table'
              exit-code: '1'
              ignore-unfixed: true
              vulu-types: 'os.library'
              severity: 'CRITICAL_HIGH'