
name: pythonlinter

on:
  push:
    paths:
      - "**.py"

jobs:
  code-linter:
    runs-on: ubuntu-latest

    steps:
      - name: checkout/clone-code
        uses: actions/checkout@v4

      - name: install linter
        run: pip install ruff

      - name: check the files for linting
        run: ruff check . --fix
