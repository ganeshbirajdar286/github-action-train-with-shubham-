# goal to install multiple version of go and do linting for multiple version



name: go linter

on:
  workflow_dispatch:

jobs:
  code-formater:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:  # this is useing to do repated task use strategy and fail-fast allow i.e if any version fails then other version should run so we use fail-fast: false
        go: ['1.22','1.23','1.24']
    steps:
      - name: setup GO
        uses: actions/setup-go@v6
        with: 
            go-version: ${{ matrix.go }}
            go-version-file: 'go.md'
            cahce-dependency-path: go.sum
      - name: run go formatter
        run: go fmt
        working-directory: backend
      - name: run go vet
        run: go vet
        working-directory: backend



