#  goal - to ensure no secreate have been leaked in the code
name: secret scanning
on: 
  workflow_call 

jobs:
  scan-secret:
      runs-on: ubuntu-latest
      steps:
        - name: code checkout
          uses: actions/checkout@v7
          with: 
            fetch-depth: 0 # this fetch all  commit form start to end 

        - name: gitleakes scanner  # use scann the secret are plaste in code too detacck them we use 
          uses: gitleaks/gitleaks-action@v3
          env:
            GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
